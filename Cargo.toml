[package]
name = "SBDeaths"
version = "1.0.1"
edition = "2024"

[features]
default = ["updater"]
updater = []

[dependencies]
anyhow = "1.0.99"
cfg-if = "1.0.1"
serde = { version = "1.0.219", features = ["derive"] }

serde_yml = "0.0.12" # Used for deserialization of the offsets.
sysinfo = "0.35.0" # Used for grabbing a correct PID to one of the Souls games.
libmem = { git = "https://github.com/rdbo/libmem.git" } # Used for the pointer arithmetic.
sha2 = "0.10.9" # Used for hashing the offsets.yaml to detect that it potentially needs an update.
reqwest = { version = "0.12.23", features = ["blocking"] } # Used to grab the offsets.yaml from the source repo.

[target.'cfg(windows)'.dependencies]
steamlocate = "2.0.1" # Used for locating where the Elden Ring install is and using that to construct a launch option for the user.
